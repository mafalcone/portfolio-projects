name: Portfolio Healthcheck

on:
  push:
    branches: [main, portfolio-audit-fixes-2026-06-25, "work/**"]
  pull_request:
    branches: [main]

jobs:
  portfolio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: presupuesto_electrico/package-lock.json
      - run: npm ci
        working-directory: presupuesto_electrico
      - run: npm run build
        working-directory: presupuesto_electrico

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: taskpulse_frontend
      - run: npm run build
        working-directory: taskpulse_frontend

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taskpulse_backend/package-lock.json
      - run: npm ci
        working-directory: taskpulse_backend
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: taskpulse_backend

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q nutrition_analyzer_py/app log_monitor_py/app web_hardening_auditor python_code_review_lab/src
